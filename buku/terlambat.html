<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Terlambat | SIMPUS-Mini</title>
  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    .content-card {
      margin: 28px auto;
      max-width: 1100px;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 25px rgba(70, 50, 100, .12);
    }

    h1 {
      color: #713df5;
      border-left: 6px solid #ef4c9b;
      padding-left: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 13px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f3edff;
      color: #333;
    }

    .terlambat {
      color: #d62828;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .content-card {
        margin: 15px;
        padding: 15px;
        overflow-x: auto;
      }

      table {
        min-width: 750px;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a href="../index.html" class="logo">SIMPUS-Mini</a>

      <div class="menu">
        <a href="../index.html">Beranda</a>
        <a href="list.html">Daftar Buku</a>
        <a href="tambah.html">Tambah Buku</a>
        <a href="../anggota/list.html">Daftar Anggota</a>
        <a href="terlambat.html" class="active">Buku Terlambat</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="content-card">
      <h1>Buku Terlambat</h1>

      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Anggota</th>
            <th>Judul Buku</th>
            <th>Tanggal Pinjam</th>
            <th>Jatuh Tempo</th>
            <th>Hari Terlambat</th>
          </tr>
        </thead>

        <tbody id="data-terlambat"></tbody>
      </table>
    </section>
  </main>

  <script>
    const dataTerlambat = JSON.parse(
      localStorage.getItem("dataTerlambat")
    ) || [
      {
        anggota: "Andi Saputra",
        buku: "Pemrograman Web",
        pinjam: "2026-08-20",
        tempo: "2026-08-27",
        terlambat: 21
      },
      {
        anggota: "Siti Aminah",
        buku: "Dasar HTML dan CSS",
        pinjam: "2026-08-25",
        tempo: "2026-09-01",
        terlambat: 16
      }
    ];

    const tabel = document.querySelector("#data-terlambat");

    tabel.innerHTML = dataTerlambat.map((item, index) => `
      <tr>
        <td>${index + 1}</td>
        <td>${item.anggota}</td>
        <td>${item.buku}</td>
        <td>${item.pinjam}</td>
        <td>${item.tempo}</td>
        <td class="terlambat">${item.terlambat} hari</td>
      </tr>
    `).join("");
  </script>
</body>
</html>
