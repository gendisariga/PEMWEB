<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Daftar Buku | SIMPUS-Mini</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

<header>

    <h1>SIMPUS-Mini</h1>

    <!-- Tombol hamburger -->
    <button
        type="button"
        id="nav-toggle-btn"
        class="nav-toggle-btn">
        ☰
    </button>

    <!-- NAVBAR -->
    <nav>
        <ul>

            <li>
                <a href="../index.html">
                    Beranda
                </a>
            </li>

            <li>
                <a href="list.html">
                    Daftar Buku
                </a>
            </li>

            <li>
                <a href="tambah.html">
                    Tambah Buku
                </a>
            </li>

            <li>
                <a href="../anggota/list.html">
                    Daftar Anggota
                </a>
            </li>

            <li>
                <a href="terlambat.html">
                    Buku Terlambat
                </a>
            </li>

        </ul>
    </nav>

</header>


<main>

    <section>

        <!-- Judul dan tombol -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

            <h2 class="mb-0">
                Daftar Buku
            </h2>

            <a
                href="tambah.html"
                class="btn btn-primary">
                + Tambah Buku
            </a>

        </div>


        <!-- Search -->
        <input
            type="text"
            id="cari-buku"
            placeholder="🔎 Cari buku...">


        <!-- Tabel -->
        <div class="table-responsive">

            <table
                id="tabel-buku"
                class="table table-hover table-bordered align-middle">

                <thead>
                    <tr>

                        <th>No</th>
                        <th>Judul Buku</th>
                        <th>Pengarang</th>
                        <th>Tahun</th>
                        <th>Stok</th>
                        <th>Aksi</th>

                    </tr>
                </thead>

                <!-- Data buku akan dimasukkan oleh buku.js -->
                <tbody id="tabel-buku-body">

                    <tr id="loading-indicator">

                        <td
                            colspan="6"
                            class="text-center">

                            Memuat data buku...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6
    </p>

</footer>


<!-- JavaScript -->
<script src="../assets/js/app.js"></script>
<script src="../assets/js/buku.js"></script>

</body>

</html>
