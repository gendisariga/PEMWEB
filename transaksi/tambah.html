<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tambah Transaksi | Laundry App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>LaundryHub</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-btn">☰</button>
        <nav>
            <ul>
                <li><a href="../index.html"><span class="nav-icon">🏠</span>Beranda</a></li>
                <li><a href="../paket/list.html"><span class="nav-icon">🧺</span>Daftar Paket</a></li>
                <li><a href="../pelanggan/list.html"><span class="nav-icon">👥</span>Daftar Pelanggan</a></li>
                <li><a href="list.html"><span class="nav-icon">🧾</span>Transaksi</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Transaksi Laundry</h2>

            <form id="form-tambah">
                <div class="mb-3">
                    <label for="pelanggan" class="form-label">Nama Pelanggan</label>
                    <input type="text" id="pelanggan" name="pelanggan" class="form-control" placeholder="Nama pelanggan">
                </div>

                <div class="mb-3">
                    <label for="paket" class="form-label">Paket</label>
                    <input type="text" id="paket" name="paket" class="form-control" placeholder="Nama paket">
                </div>

                <div class="mb-3">
                    <label for="berat" class="form-label">Berat / Jumlah</label>
                    <input type="text" id="berat" name="berat" class="form-control" placeholder="Contoh: 3 kg / 1 pasang">
                </div>

                <div class="mb-3">
                    <label for="total" class="form-label">Total</label>
                    <input type="number" id="total" name="total" class="form-control" placeholder="Masukkan total harga">
                </div>

                <button type="submit" class="btn btn-primary">Simpan</button>
                <a href="list.html" class="btn btn-secondary">Kembali</a>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 LaundryHub &mdash; Sistem Laundry</p>
    </footer>

    <script src="../assets/js/app.js"></script>
</body>
</html>
