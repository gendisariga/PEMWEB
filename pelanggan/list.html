<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Pelanggan | Laundry App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header>
        <h1>LaundryHub</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-btn">☰</button>
        <nav>
            <ul>
                <li><a href="../index.html"><span class="nav-icon">🏠</span>Beranda</a></li>
                <li><a href="../paket/list.html"><span class="nav-icon">🧺</span>Daftar Paket</a></li>
                <li><a href="list.html"><span class="nav-icon">👥</span>Daftar Pelanggan</a></li>
                <li><a href="tambah.html"><span class="nav-icon">➕</span>Tambah Pelanggan</a></li>
                <li><a href="../transaksi/list.html"><span class="nav-icon">🧾</span>Transaksi</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h2 class="mb-0">Daftar Pelanggan</h2>
                <a href="tambah.html" class="btn btn-primary">+ Tambah Pelanggan</a>
            </div>

            <input type="text" id="cari-pelanggan" class="search-box" data-target="#tabel-pelanggan" placeholder="🔎 Cari pelanggan...">

            <div class="table-responsive">
                <table id="tabel-pelanggan" class="table table-hover table-bordered align-middle">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>No. Pelanggan</th>
                            <th>Nama</th>
                            <th>Alamat</th>
                            <th>No. HP</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="6" class="text-center">Memuat data pelanggan...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 LaundryHub &mdash; Sistem Laundry</p>
    </footer>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/pelanggan.js"></script>
</body>

</html>
