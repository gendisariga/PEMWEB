<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Tambah Anggota | SIMPUS-Mini</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="../assets/css/style.css">

</head>


<body>

<header>

    <h1>SIMPUS-Mini</h1>

    <button
        type="button"
        id="nav-toggle-btn"
        class="nav-toggle-btn">
        ☰
    </button>

    <nav>

        <ul>

            <li>
                <a href="../index.html">
                    Beranda
                </a>
            </li>

            <li>
                <a href="../buku/list.html">
                    Daftar Buku
                </a>
            </li>

            <li>
                <a href="../buku/tambah.html">
                    Tambah Buku
                </a>
            </li>

            <li>
                <a href="list.html">
                    Daftar Anggota
                </a>
            </li>

            <li>
                <a href="../buku/terlambat.html">
                    Buku Terlambat
                </a>
            </li>

        </ul>

    </nav>

</header>


<main>

    <section>

        <h2>Tambah Anggota</h2>


        <form id="form-tambah">


            <div class="mb-3">

                <label
                    for="nama"
                    class="form-label">
                    Nama
                </label>

                <input
                    type="text"
                    id="nama"
                    name="nama"
                    class="form-control"
                    placeholder="Masukkan nama">

            </div>


            <div class="mb-3">

                <label
                    for="no_anggota"
                    class="form-label">
                    No. Anggota
                </label>

                <input
                    type="text"
                    id="no_anggota"
                    name="no_anggota"
                    class="form-control"
                    placeholder="Contoh: A003">

            </div>


            <div class="mb-3">

                <label
                    for="alamat"
                    class="form-label">
                    Alamat
                </label>

                <input
                    type="text"
                    id="alamat"
                    name="alamat"
                    class="form-control"
                    placeholder="Masukkan alamat">

            </div>


            <div class="mb-3">

                <label
                    for="no_hp"
                    class="form-label">
                    No. HP
                </label>

                <input
                    type="text"
                    id="no_hp"
                    name="no_hp"
                    class="form-control"
                    placeholder="Masukkan nomor HP">

            </div>


            <button
                type="submit"
                class="btn btn-primary">
                Simpan
            </button>


            <a
                href="list.html"
                class="btn btn-secondary">
                Kembali
            </a>


        </form>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 SIMPUS-Mini &mdash; Jobsheet 5
    </p>

</footer>


<script src="../assets/js/app.js"></script>

</body>

</html>
