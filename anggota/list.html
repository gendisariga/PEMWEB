<main>

    <section>

        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

            <h2 class="mb-0">
                Daftar Anggota
            </h2>

            <a
                href="tambah.html"
                class="btn btn-primary">
                + Tambah Anggota
            </a>

        </div>


        <input
            type="text"
            class="search-box"
            data-target="#tabel-anggota"
            placeholder="🔎 Cari anggota...">


        <div class="table-responsive">

            <table
                id="tabel-anggota"
                class="table table-hover table-bordered align-middle">

                <thead>

                    <tr>

                        <th>No. Anggota</th>

                        <th>Nama</th>

                        <th>Alamat</th>

                        <th>No. HP</th>

                        <th>Aksi</th>

                    </tr>

                </thead>


                <tbody>

                    <tr>

                        <td>A001</td>

                        <td>Siti Aminah</td>

                        <td>Malang</td>

                        <td>0812xxxx</td>

                        <td>

                            <button
                                type="button"
                                class="btn btn-warning btn-sm">
                                Edit
                            </button>

                            <button
                                type="button"
                                class="btn btn-danger btn-sm btn-hapus">
                                Hapus
                            </button>

                        </td>

                    </tr>


                    <tr>

                        <td>A002</td>

                        <td>Budi Santoso</td>

                        <td>Batu</td>

                        <td>0813xxxx</td>

                        <td>

                            <button
                                type="button"
                                class="btn btn-warning btn-sm">
                                Edit
                            </button>

                            <button
                                type="button"
                                class="btn btn-danger btn-sm btn-hapus">
                                Hapus
                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>
